name: Exploitability

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # CodeQL uploads its alerts to Code Scanning
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp     # change to your project's language

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp

  exploitability:
    needs: codeql               # runs after the alerts exist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read     # the action reads Code Scanning alerts
    steps:
      - uses: actions/checkout@v4

      - name: Assess open Code Scanning alerts
        uses: hackin2minutes-oss/hackin2minutes-oss-exploitability-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          code-scanning-repo: ${{ github.repository }}
          code-scanning-ref: ${{ github.ref }}
          exposure: internet
          fail-on: confirmed_exploitable
